<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-yoga-mat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2529"/>
      <stop offset="100%" stop-color="#144e57"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-yoga-mat)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Unrolled Mat Surface -->
      <polygon points="200,430 400,430 360,200 240,200" fill="#0d9488" stroke="#99f6e4" stroke-width="4"/>
      <!-- Alignment Lines -->
      <line x1="300" y1="210" x2="300" y2="420" stroke="#ccfbf1" stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="300" cy="315" r="30" fill="none" stroke="#ccfbf1" stroke-width="2"/>
      <line x1="250" y1="270" x2="350" y2="270" stroke="#ccfbf1" stroke-width="2"/>
      <line x1="230" y1="360" x2="370" y2="360" stroke="#ccfbf1" stroke-width="2"/>
      <!-- Rolled End at Top -->
      <ellipse cx="300" cy="200" rx="60" ry="14" fill="#115e59" stroke="#99f6e4" stroke-width="3"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#2dd4bf" letter-spacing="2" text-transform="uppercase">Sports & Fitness</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Eco TPE Yoga Mat 6 mm</text>
</svg>