<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-vitamin-c-serum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1808"/>
      <stop offset="100%" stop-color="#5c3311"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-vitamin-c-serum)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#fb923c" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#fb923c" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Dropper Pipette Top -->
      <rect x="290" y="110" width="20" height="30" rx="5" fill="#f8fafc"/>
      <rect x="280" y="140" width="40" height="20" rx="4" fill="#0f172a"/>
      <!-- Amber Glass Bottle Body -->
      <path d="M 265 200 L 265 430 Q 265 440, 275 440 L 325 440 Q 335 440, 335 430 L 335 200 Z" fill="#ea580c" stroke="#fed7aa" stroke-width="4"/>
      <!-- Serum Label -->
      <rect x="272" y="250" width="56" height="110" rx="4" fill="#fff7ed"/>
      <text x="300" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">GLOW</text>
      <text x="300" y="300" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">VIT C</text>
      <text x="300" y="325" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">15% + HA</text>
      <text x="300" y="345" font-family="system-ui, sans-serif" font-size="7" fill="#ea580c" text-anchor="middle">30 ML</text>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#fb923c" letter-spacing="2" text-transform="uppercase">Beauty & Care</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Glow Vitamin C Serum</text>
</svg>