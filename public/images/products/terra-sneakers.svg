<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-terra-sneakers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18242c"/>
      <stop offset="100%" stop-color="#2d3e48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-terra-sneakers)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Sneaker Silhouette -->
      <path d="M 170 340 C 180 300, 240 270, 290 270 C 330 250, 360 210, 390 220 C 410 230, 425 260, 430 310 C 435 340, 410 360, 380 365 L 170 365 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
      <!-- EVA Sole -->
      <path d="M 160 365 L 435 365 C 435 385, 410 395, 380 395 L 175 395 C 160 395, 155 385, 160 365 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <!-- Laces -->
      <line x1="310" y1="270" x2="330" y2="295" stroke="#f59e0b" stroke-width="4"/>
      <line x1="325" y1="260" x2="345" y2="285" stroke="#f59e0b" stroke-width="4"/>
      <line x1="340" y1="250" x2="360" y2="275" stroke="#f59e0b" stroke-width="4"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="2" text-transform="uppercase">Fashion</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Terra Sneakers</text>
</svg>