<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-charcoal-face-wash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-charcoal-face-wash)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Face Wash Tube Silhouette -->
      <path d="M 240 160 L 360 160 L 340 390 L 260 390 Z" fill="#18181b" stroke="#71717a" stroke-width="5"/>
      <!-- Flip Cap -->
      <rect x="270" y="390" width="60" height="35" rx="6" fill="#09090b" stroke="#2dd4bf" stroke-width="3"/>
      <!-- Branding & Graphics on Tube -->
      <circle cx="300" cy="240" r="28" fill="#27272a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="300" y="244" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#2dd4bf" text-anchor="middle">CHARCOAL</text>
      <line x1="270" y1="285" x2="330" y2="285" stroke="#f43f5e" stroke-width="3"/>
      <text x="300" y="315" font-family="system-ui, sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle">DEEP CLEAN</text>
      <text x="300" y="340" font-family="system-ui, sans-serif" font-size="8" fill="#a1a1aa" text-anchor="middle">100 ml</text>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#2dd4bf" letter-spacing="2" text-transform="uppercase">Beauty & Care</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Activated Charcoal Face Wash</text>
</svg>