<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-graphic-tee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1519"/>
      <stop offset="100%" stop-color="#571e27"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-graphic-tee)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- T-Shirt Silhouette -->
      <path d="M 220 180 L 150 250 L 195 285 L 225 245 L 225 450 L 375 450 L 375 245 L 405 285 L 450 250 L 380 180 C 350 215, 250 215, 220 180 Z" fill="#e11d48" stroke="#fecdd3" stroke-width="4"/>
      <!-- Graphic Art on Chest -->
      <circle cx="300" cy="300" r="35" fill="#f59e0b"/>
      <polygon points="265,340 335,340 300,280" fill="#0f172a"/>
      <path d="M 270 335 Q 300 310 330 335" fill="none" stroke="#f8fafc" stroke-width="3"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f43f5e" letter-spacing="2" text-transform="uppercase">Fashion</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Everyday Graphic Tee</text>
</svg>