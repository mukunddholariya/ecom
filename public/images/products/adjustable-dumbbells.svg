<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-adjustable-dumbbells" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-adjustable-dumbbells)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Handle -->
      <rect x="220" y="288" width="160" height="24" rx="4" fill="#94a3b8" stroke="#f8fafc" stroke-width="2"/>
      <!-- Left Weight Plates -->
      <rect x="180" y="210" width="22" height="180" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <rect x="150" y="230" width="22" height="140" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <rect x="120" y="250" width="22" height="100" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <!-- Right Weight Plates -->
      <rect x="398" y="210" width="22" height="180" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <rect x="428" y="230" width="22" height="140" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <rect x="458" y="250" width="22" height="100" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <!-- Selection Dial -->
      <circle cx="205" cy="300" r="14" fill="#f59e0b"/>
      <circle cx="395" cy="300" r="14" fill="#f59e0b"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="2" text-transform="uppercase">Sports & Fitness</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Adjustable Dumbbell Pair</text>
</svg>