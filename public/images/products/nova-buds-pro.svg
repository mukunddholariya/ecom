<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-nova-buds-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08262c"/>
      <stop offset="100%" stop-color="#0f434e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-nova-buds-pro)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <circle cx="300" cy="270" r="110" fill="#08262c" stroke="#14b8a6" stroke-width="4" stroke-dasharray="8 6"/>
      <!-- Left Earbud -->
      <rect x="235" y="240" width="30" height="75" rx="15" fill="#f8fafc"/>
      <ellipse cx="250" cy="235" rx="26" ry="22" fill="#14b8a6"/>
      <circle cx="250" cy="235" r="8" fill="#08262c"/>
      <!-- Right Earbud -->
      <rect x="335" y="240" width="30" height="75" rx="15" fill="#f8fafc"/>
      <ellipse cx="350" cy="235" rx="26" ry="22" fill="#14b8a6"/>
      <circle cx="350" cy="235" r="8" fill="#08262c"/>
      <!-- Charging Case Silhouette -->
      <rect x="240" y="360" width="120" height="70" rx="30" fill="#0f434e" stroke="#14b8a6" stroke-width="3"/>
      <circle cx="300" cy="395" r="4" fill="#38bdf8"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#14b8a6" letter-spacing="2" text-transform="uppercase">Electronics</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Nova Buds Pro</text>
</svg>