<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-cast-iron-kadai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#2b2b30"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-cast-iron-kadai)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Kadai Wok Bowl -->
      <ellipse cx="300" cy="300" rx="140" ry="40" fill="#1c1917" stroke="#78716c" stroke-width="5"/>
      <path d="M 160 300 C 160 390, 440 390, 440 300" fill="#292524" stroke="#78716c" stroke-width="5"/>
      <!-- Left Handle -->
      <path d="M 160 290 C 120 280, 120 320, 160 315" fill="none" stroke="#d6d3d1" stroke-width="8" stroke-linecap="round"/>
      <!-- Right Handle -->
      <path d="M 440 290 C 480 280, 480 320, 440 315" fill="none" stroke="#d6d3d1" stroke-width="8" stroke-linecap="round"/>
      <!-- Heat / Steam Waves -->
      <path d="M 270 230 Q 280 200, 270 170" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M 300 220 Q 310 190, 300 160" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M 330 230 Q 340 200, 330 170" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b" letter-spacing="2" text-transform="uppercase">Home & Kitchen</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Cast Iron Kadai 28 cm</text>
</svg>