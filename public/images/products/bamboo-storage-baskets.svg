<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-bamboo-storage-baskets" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#251c14"/>
      <stop offset="100%" stop-color="#4a3b2c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-bamboo-storage-baskets)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Large Basket -->
      <path d="M 210 260 L 230 420 L 370 420 L 390 260 Z" fill="#d97706" stroke="#fef3c7" stroke-width="4"/>
      <!-- Woven Lines -->
      <line x1="220" y1="300" x2="380" y2="300" stroke="#78350f" stroke-width="4" stroke-dasharray="12 6"/>
      <line x1="224" y1="340" x2="376" y2="340" stroke="#78350f" stroke-width="4" stroke-dasharray="12 6"/>
      <line x1="228" y1="380" x2="372" y2="380" stroke="#78350f" stroke-width="4" stroke-dasharray="12 6"/>
      <line x1="300" y1="260" x2="300" y2="420" stroke="#78350f" stroke-width="3"/>
      <!-- Eco Leaf -->
      <path d="M 300 210 Q 330 190, 320 225 Q 300 230, 300 210 Z" fill="#22c55e"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" letter-spacing="2" text-transform="uppercase">Home & Kitchen</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Bamboo Storage Basket Set</text>
</svg>