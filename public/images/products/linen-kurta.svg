<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-linen-kurta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-linen-kurta)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Kurta Silhouette -->
      <path d="M 230 180 L 190 250 L 220 270 L 240 230 L 240 450 L 360 450 L 360 230 L 380 270 L 410 250 L 370 180 Z" fill="#1e3a5f" stroke="#93c5fd" stroke-width="4"/>
      <!-- Mandarin Collar -->
      <path d="M 275 180 C 275 165, 325 165, 325 180" fill="none" stroke="#93c5fd" stroke-width="5"/>
      <!-- Placket & Buttons -->
      <line x1="300" y1="180" x2="300" y2="300" stroke="#f8fafc" stroke-width="4"/>
      <circle cx="300" cy="205" r="4" fill="#f59e0b"/>
      <circle cx="300" cy="235" r="4" fill="#f59e0b"/>
      <circle cx="300" cy="265" r="4" fill="#f59e0b"/>
      <circle cx="300" cy="295" r="4" fill="#f59e0b"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" letter-spacing="2" text-transform="uppercase">Fashion</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Linen Blend Straight Kurta</text>
</svg>