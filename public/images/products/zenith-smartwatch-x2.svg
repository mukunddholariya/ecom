<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-zenith-smartwatch-x2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="100%" stop-color="#1e3e62"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bg-zenith-smartwatch-x2)"/>

  <!-- Subtle Decorative Grid / Tech Accent -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Product Vector Illustration -->
  
      <!-- Watch Strap Top -->
      <rect x="260" y="100" width="80" height="120" rx="12" fill="#1e293b"/>
      <!-- Watch Strap Bottom -->
      <rect x="260" y="380" width="80" height="120" rx="12" fill="#1e293b"/>
      <!-- Watch Body -->
      <rect x="220" y="200" width="160" height="200" rx="42" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
      <!-- Screen -->
      <rect x="235" y="215" width="130" height="170" rx="30" fill="#020617"/>
      <!-- Clock & Stats on Screen -->
      <text x="300" y="275" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="#f8fafc" text-anchor="middle">10:42</text>
      <text x="300" y="305" font-family="system-ui, sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">WED, 28 OCT</text>
      <!-- Heart Rate Icon -->
      <path d="M 280 340 L 290 340 L 295 325 L 305 355 L 310 340 L 320 340" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    

  <!-- Lower Branding Overlay -->
  <rect y="490" width="600" height="110" fill="#020617" opacity="0.6"/>
  <text x="40" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="2" text-transform="uppercase">Electronics</text>
  <text x="40" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Zenith Smartwatch X2</text>
</svg>